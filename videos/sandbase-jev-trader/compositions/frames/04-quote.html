  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var tl = gsap.timeline({ paused: true });

      // Travel targets, solved for the plate's scale about its own top-left so the
      // named region lands dead-centre in the clipped window.
      var W = 1280;
      var H = 720;
      var CX = 640;
      var CY = 360;
      function at(cx, cy, s) {
        return { x: CX - cx * W * s, y: CY - cy * H * s, scale: s };
      }
      // regions read off the plate: the right column's three panels
      var WIDE = at(0.5, 0.5, 1);
      var DECISION = at(0.742, 0.171, 2);
      var TAPE = at(0.742, 0.737, 2);

      tl.set('#f04-plate', { x: WIDE.x, y: WIDE.y, scale: WIDE.scale, transformOrigin: '0% 0%' }, 0);

      // Scene 1 (0.0-1.5s): the whole instrument, held wide. The eyebrow arrives.
      tl.fromTo('#root .f04-eyebrow', { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.6, ease: 'power3.out' }, 0.3);

      // Scene 2 (1.5-3.8s): leg one - down the right column onto the decision panel,
      // where the quote is priced. The callouts arrive on their own cues.
      tl.to('#f04-plate', { x: DECISION.x, y: DECISION.y, scale: DECISION.scale, duration: 1.5, ease: 'power2.inOut' }, 1.5);
      tl.fromTo('#root .f04-scrim', { opacity: 0 }, { opacity: 1, duration: 0.5, ease: 'power3.out' }, 2.3);
      tl.fromTo('#f04-k1', { opacity: 0, x: 16 }, { opacity: 1, x: 0, duration: 0.45, ease: 'power3.out' }, 2.35);
      tl.fromTo('#f04-v1', { opacity: 0, x: 16 }, { opacity: 1, x: 0, duration: 0.5, ease: 'power3.out' }, 2.6);
      tl.fromTo('#f04-k2', { opacity: 0, x: 16 }, { opacity: 1, x: 0, duration: 0.45, ease: 'power3.out' }, 3.5);
      tl.fromTo('#f04-v2', { opacity: 0, x: 16 }, { opacity: 1, x: 0, duration: 0.5, ease: 'power3.out' }, 3.72);

      // Scene 3 (3.8-5.6s): leg two - down to the tape, where fills print.
      tl.to('#f04-plate', { x: TAPE.x, y: TAPE.y, scale: TAPE.scale, duration: 1.25, ease: 'power2.inOut' }, 3.9);
      tl.fromTo('#f04-k3', { opacity: 0, x: 16 }, { opacity: 1, x: 0, duration: 0.45, ease: 'power3.out' }, 5.0);
      tl.fromTo('#f04-v3', { opacity: 0, x: 16 }, { opacity: 1, x: 0, duration: 0.5, ease: 'power3.out' }, 5.22);

      // Scene 4 (5.6-7.0s): the camera eases back out to the whole desk and rests.
      tl.to('#f04-plate', { x: WIDE.x, y: WIDE.y, scale: WIDE.scale, duration: 1.15, ease: 'power2.inOut' }, 5.6);
      tl.to('#root .f04-scrim', { opacity: 0, duration: 0.5, ease: 'power2.in' }, 5.7);
      tl.to('#root .f04-railwrap', { opacity: 0, duration: 0.5, ease: 'power2.in' }, 5.7);

      window.__timelines['04-quote'] = tl;
      tl.seek(0);
    })();
  </script>
