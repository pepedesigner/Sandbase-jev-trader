<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #F0EEE9;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="34.5"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="el-01-hook"
        class="scene"
        data-composition-id="01-hook"
        data-composition-src="compositions/frames/01-hook.html"
        data-start="0"
        data-duration="4"
        data-track-index="1"
      ></div>

      <div
        id="el-02-intro"
        class="scene"
        data-composition-id="02-intro"
        data-composition-src="compositions/frames/02-intro.html"
        data-start="4"
        data-duration="4.5"
        data-track-index="1"
      ></div>

      <div
        id="el-03-decision"
        class="scene"
        data-composition-id="03-decision"
        data-composition-src="compositions/frames/03-decision.html"
        data-start="8.5"
        data-duration="7"
        data-track-index="1"
      ></div>

      <div
        id="el-04-quote"
        class="scene"
        data-composition-id="04-quote"
        data-composition-src="compositions/frames/04-quote.html"
        data-start="15.5"
        data-duration="7"
        data-track-index="1"
      ></div>

      <div
        id="el-05-numbers"
        class="scene"
        data-composition-id="05-numbers"
        data-composition-src="compositions/frames/05-numbers.html"
        data-start="22.5"
        data-duration="7"
        data-track-index="1"
      ></div>

      <div
        id="el-06-outro"
        class="scene"
        data-composition-id="06-outro"
        data-composition-src="compositions/frames/06-outro.html"
        data-start="29.5"
        data-duration="5"
        data-track-index="1"
      ></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
